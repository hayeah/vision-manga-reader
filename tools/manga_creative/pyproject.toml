[project]
name = "manga-creative"
version = "0.1.0"
description = "Manga creative tools — panel segmentation and colorization CLI"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "Pillow",
    "manga-panel-segmenter",
    "hayeah-core",
    "hayeah-imagegen",
    "python-dotenv",
]

[tool.uv.sources]
manga-panel-segmenter = { path = "../manga_panel_segmenter", editable = true }
hayeah-core = { path = "../../../dotfiles/hayeah", editable = true }
hayeah-imagegen = { path = "../../../dotfiles/skills/imagegen", editable = true }

[project.scripts]
manga = "manga_creative.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_creative"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "basic"
